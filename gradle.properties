# Memory & JVM – tuned for 16-core / 32 GB DDR5 rig
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Kotlin daemon (separate process for Kotlin/Compose/KSP compiler)
kotlin.daemon.jvmargs=-Xmx6g -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.incremental=true

# Parallelism & Worker concurrency (matched to 16 physical cores)
org.gradle.parallel=true
org.gradle.workers.max=16
org.gradle.vfs.watch=true

# Caching & Configuration
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# Android compilation & R8 optimizations
android.useAndroidX=true
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.builder.sdkDownload=false

# KSP incremental processing
ksp.incremental=true

# Parallel tooling sync for Gradle 9.4+
org.gradle.tooling.parallel=true
